<body>

<!-- NAVBAR -->
<header class="navbar">
    <div class="logo">
        <img src="img/logo.png" alt="Colibrí Creativo">
    </div>

    <nav class="menu">
        <a href="index.html">Inicio</a>
        <a href="quienes.html">Quiénes somos</a>

</header>

<!-- CONTENIDO -->
<main>

<section class="catalogo">

    <h1>Catálogo</h1>

    <div class="productos">

        <div class="card">
            <img src="img/taz4.jpg" onclick="abrirModal(this.src)">

            <h3>Taza Tomi</h3>
            <p>$150</p>
            <button onclick="agregarCarrito('Invitación',150)">Agregar</button>
        </div>

        <div class="card">
            <img src="img/taz2.jpg" onclick="abrirModal(this.src)">
            <h3>Taza Reptar</h3>
            <p>$250</p>
            <button onclick="agregarCarrito('Taza',250)">Agregar</button>
        </div>

        <div class="card">
            <img src="img/taz3.jpg" onclick="abrirModal(this.src)">
            <h3>Taza Carlitos</h3>
            <p>$300</p>
            <button onclick="agregarCarrito('Caja',300)">Agregar</button>
        </div>

    </div>

</section>

</main>

<!-- MODAL -->
<div id="modal" class="modal" onclick="cerrarModal()">
    <img id="imagenGrande">
</div>
